<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="760" viewBox="0 0 1130 760" role="img" aria-labelledby="title description">
  <title id="title">PolicyC frozen held-out paired-execution protocol by compiler version</title>
  <desc id="description">Compiler 0.5 used 50 cases, 300 planned trial slots, 129 of 150 complete pairs, 0 web searches, 0.002592 dollars per full-policy execution, 0.001995 dollars per compiled execution, and 0.6881 dollars across all issued paired-study calls; Compiler 0.6 used 50 cases, 300 planned trial slots, 139 of 150 complete pairs, 41 web searches, 0.003934 dollars per full-policy execution, 0.002970 dollars per compiled execution, and 1.0357 dollars across all issued paired-study calls; Compiler 0.7 used 60 cases, 360 planned trial slots, 180 of 180 complete pairs, 20 web searches, 0.002760 dollars per full-policy execution, 0.002425 dollars per compiled execution, and 0.9333 dollars across all issued paired-study calls; Compiler 0.8 used 60 cases, 360 planned trial slots, 163 of 180 complete pairs, 16 web searches, 0.002885 dollars per full-policy execution, 0.002365 dollars per compiled execution, and 1.0653 dollars across all issued paired-study calls; Compiler 0.9 used 60 cases, 360 planned trial slots, 177 of 180 complete pairs, 26 web searches, 0.003427 dollars per full-policy execution, 0.002837 dollars per compiled execution, and 1.1790 dollars across all issued paired-study calls. Compiler 0.9 also used 60 compile-time extractor calls costing 0.2678 dollars, reported separately. Per-execution costs follow each frozen audit&#x27;s reported efficiency basis. Every version used a newly authored held-out set.</desc>


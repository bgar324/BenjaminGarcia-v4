<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="760" viewBox="0 0 1130 760" role="img" aria-labelledby="title description">
  <title id="title">PolicyC frozen held-out paired-execution protocol by compiler version</title>
  <desc id="description">Compiler 0.5 used 50 cases, 300 planned trial slots, 129 of 150 complete pairs, 0 web searches, and paired-execution cost 0.6881 dollars; Compiler 0.6 used 50 cases, 300 planned trial slots, 139 of 150 complete pairs, 41 web searches, and paired-execution cost 1.0357 dollars; Compiler 0.7 used 60 cases, 360 planned trial slots, 180 of 180 complete pairs, 20 web searches, and paired-execution cost 0.9333 dollars; Compiler 0.8 used 60 cases, 360 planned trial slots, 163 of 180 complete pairs, 16 web searches, and paired-execution cost 1.0653 dollars; Compiler 0.9 used 60 cases, 360 planned trial slots, 177 of 180 complete pairs, 26 web searches, and paired-execution cost 1.1790 dollars. Compiler 0.9 also used 60 compile-time extractor calls costing 0.2678 dollars, reported separately. Every version used a newly authored held-out set.</desc>

  <rect width="1130" height="760" fill="#fcfcfb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#2c2826">
    <text x="40" y="58" font-size="29" font-weight="650">Five frozen held-out studies</text>
    <text x="1090" y="58" text-anchor="end" fill="#6b6763" font-size="22">New case set after every compiler</text>
    <line x1="40" y1="112" x2="1090" y2="112" stroke="#2c2826" stroke-width="1.5" />
    <text x="55" y="148" fill="#6b6763" font-size="18" font-weight="600">Compiler</text>
    <text x="165" y="148" fill="#6b6763" font-size="18" font-weight="600">Cases</text>
    <text x="280" y="148" fill="#6b6763" font-size="18" font-weight="600">Trial slots</text>
    <text x="455" y="148" fill="#6b6763" font-size="18" font-weight="600">Complete pairs</text>
    <text x="655" y="148" fill="#6b6763" font-size="18" font-weight="600">Tool activity</text>
    <text x="1050" y="148" text-anchor="end" fill="#6b6763" font-size="18" font-weight="600">Paired run cost</text>
    <line x1="40" y1="170" x2="1090" y2="170" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="222" font-size="21" font-weight="650">0.5</text>
    <text x="165" y="222" font-size="21">50</text>
    <text x="280" y="222" font-size="21">300</text>
    <text x="455" y="222" font-size="21">129 / 150</text>
    <text x="655" y="222" font-size="20">No provider tools</text>
    <text x="1050" y="222" text-anchor="end" font-size="21">$0.6881</text>
    <line x1="40" y1="245" x2="1090" y2="245" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="297" font-size="21" font-weight="650">0.6</text>
    <text x="165" y="297" font-size="21">50</text>
    <text x="280" y="297" font-size="21">300</text>
    <text x="455" y="297" font-size="21">139 / 150</text>
    <text x="655" y="297" font-size="20">41 web searches</text>
    <text x="1050" y="297" text-anchor="end" font-size="21">$1.0357</text>
    <line x1="40" y1="320" x2="1090" y2="320" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="372" font-size="21" font-weight="650">0.7</text>
    <text x="165" y="372" font-size="21">60</text>
    <text x="280" y="372" font-size="21">360</text>
    <text x="455" y="372" font-size="21">180 / 180</text>
    <text x="655" y="372" font-size="20">20 web searches</text>
    <text x="1050" y="372" text-anchor="end" font-size="21">$0.9333</text>
    <line x1="40" y1="395" x2="1090" y2="395" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="447" font-size="21" font-weight="650">0.8</text>
    <text x="165" y="447" font-size="21">60</text>
    <text x="280" y="447" font-size="21">360</text>
    <text x="455" y="447" font-size="21">163 / 180</text>
    <text x="655" y="447" font-size="20">16 web searches</text>
    <text x="1050" y="447" text-anchor="end" font-size="21">$1.0653</text>
    <line x1="40" y1="470" x2="1090" y2="470" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="522" font-size="21" font-weight="650">0.9</text>
    <text x="165" y="522" font-size="21">60</text>
    <text x="280" y="522" font-size="21">360</text>
    <text x="455" y="522" font-size="21">177 / 180</text>
    <text x="655" y="522" font-size="20">26 web searches</text>
    <text x="1050" y="522" text-anchor="end" font-size="21">$1.1790</text>
    <line x1="40" y1="545" x2="1090" y2="545" stroke="#d4d1cb" stroke-width="1.5" />
    <rect x="40" y="558" width="1050" height="170" fill="#f4f3ef" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="62" y="589" font-size="18" font-weight="600">Compiler 0.6 semantic denominator</text>
    <text x="430" y="589" fill="#6b6763" font-size="18">136 determinate pairs + 3 ungradable complete pairs</text>
    <text x="62" y="625" font-size="18" font-weight="600">Compiler 0.9 dispatch</text>
    <text x="430" y="625" fill="#6b6763" font-size="18">359 of 360 calls issued; one trial stopped at the call ceiling</text>
    <text x="62" y="661" font-size="18" font-weight="600">Compiler 0.9 compile-time frontend</text>
    <text x="430" y="661" fill="#6b6763" font-size="18">60 extractor calls · $0.2678, reported separately</text>
    <text x="62" y="697" font-size="18" font-weight="600">Paired-execution total</text>
    <text x="430" y="697" fill="#6b6763" font-size="18">280 cases · 1,680 planned trial slots · 103 searches · $4.9013</text>
  </g>
</svg>

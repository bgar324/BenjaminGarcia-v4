<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="620" viewBox="0 0 1130 620" role="img" aria-labelledby="title description">
  <title id="title">PolicyC frozen held-out study protocol by compiler version</title>
  <desc id="description">Compiler 0.5 used 50 cases, 300 model executions, 129 of 150 complete pairs, no provider tools, and cost 0.6881 dollars. Compiler 0.6 used 50 cases, 300 model executions, 139 of 150 complete pairs, 41 web searches, and cost 1.0357 dollars. Compiler 0.7 used 60 cases, 360 model executions, 180 of 180 complete pairs, 20 web searches, and cost 0.9333 dollars. Compiler 0.6 had 136 semantically determinate pairs and three ungradable complete pairs. Every version used a newly authored held-out set.</desc>
  <rect width="1130" height="620" fill="#fcfcfb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#2c2826">
    <text x="40" y="58" font-size="29" font-weight="650">Three frozen held-out studies</text>
    <text x="1090" y="58" text-anchor="end" fill="#6b6763" font-size="22">New case set after every compiler</text>

    <line x1="40" y1="112" x2="1090" y2="112" stroke="#2c2826" stroke-width="1.5" />
    <g fill="#6b6763" font-size="18" font-weight="600">
      <text x="55" y="148">Compiler</text>
      <text x="190" y="148">Cases</text>
      <text x="310" y="148">Model executions</text>
      <text x="520" y="148">Complete pairs</text>
      <text x="710" y="148">Tool activity</text>
      <text x="1015" y="148" text-anchor="end">Recorded cost</text>
    </g>
    <line x1="40" y1="170" x2="1090" y2="170" stroke="#d4d1cb" stroke-width="1.5" />

    <g font-size="22">
      <text x="55" y="226" font-weight="650">0.5</text>
      <text x="190" y="226">50</text>
      <text x="310" y="226">300</text>
      <text x="520" y="226">129 / 150</text>
      <text x="710" y="226">No provider tools</text>
      <text x="1015" y="226" text-anchor="end">$0.6881</text>

      <text x="55" y="318" font-weight="650">0.6</text>
      <text x="190" y="318">50</text>
      <text x="310" y="318">300</text>
      <text x="520" y="318">139 / 150</text>
      <text x="710" y="318">41 web searches</text>
      <text x="1015" y="318" text-anchor="end">$1.0357</text>

      <text x="55" y="410" font-weight="650">0.7</text>
      <text x="190" y="410">60</text>
      <text x="310" y="410">360</text>
      <text x="520" y="410">180 / 180</text>
      <text x="710" y="410">20 web searches</text>
      <text x="1015" y="410" text-anchor="end">$0.9333</text>
    </g>
    <g stroke="#d4d1cb" stroke-width="1.5">
      <line x1="40" y1="262" x2="1090" y2="262" />
      <line x1="40" y1="354" x2="1090" y2="354" />
      <line x1="40" y1="446" x2="1090" y2="446" />
    </g>

    <rect x="40" y="486" width="1050" height="92" fill="#f4f3ef" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="62" y="522" font-size="19" font-weight="600">Compiler 0.6 semantic denominator</text>
    <text x="430" y="522" fill="#6b6763" font-size="19">136 determinate pairs + 3 ungradable complete pairs</text>
    <text x="62" y="555" fill="#6b6763" font-size="19">Total program: 160 cases · 960 model executions · $2.6570 recorded cost</text>
  </g>
</svg>

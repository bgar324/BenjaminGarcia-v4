<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="762" viewBox="0 0 1130 762" role="img" aria-labelledby="title description">
  <title id="title">PolicyC conditional critical-obligation preservation across compiler versions</title>
  <desc id="description">Conditional critical-obligation preservation by compiler was 85.98 percent for 0.5, with a trial-level Wilson 95 percent interval from 78.15 to 91.32 percent; 86.49 percent for 0.6, with a trial-level Wilson 95 percent interval from 76.88 to 92.49 percent; 79.75 percent for 0.7, with a trial-level Wilson 95 percent interval from 72.93 to 85.21 percent; 75.76 percent for 0.8, with a trial-level Wilson 95 percent interval from 67.79 to 82.27 percent; 75.91 percent for 0.9, with a trial-level Wilson 95 percent interval from 68.11 to 82.30 percent. Every result was below the 95 percent target. The intervals are descriptive because samples are clustered by case, and every version used a different held-out set. More preservation is better; less is worse.</desc>


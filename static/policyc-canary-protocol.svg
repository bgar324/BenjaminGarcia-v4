<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="760" viewBox="0 0 1130 760" role="img" aria-labelledby="title description">
  <title id="title">PolicyC canary protocol and outcomes</title>
  <desc id="description">Canary 1 used 4 cases and the arms full · clause · compiler over 29 paid calls costing 0.0616 dollars to ask: Does the model apply a preserved condition? Outcome: No: re-asked on the confirmed send; Canary 2 used 8 cases and the arms + evidence bare · apply over 80 paid calls costing 0.1639 dollars to ask: Does quoted evidence beside the rule help? Outcome: Worse: evidence became a checklist; Canary 3 used 8 cases and the arms + model reader over 92 paid calls costing 0.4110 dollars to ask: Does a model reading the clauses read? Outcome: Yes: 3 of 4 fresh confirmations, 0 unsafe; Canary 4 used 8 cases and the arms 3 cheaper readers, no answers over 24 paid calls costing 0.0260 dollars to ask: Can a cheaper reader keep the reading? Outcome: No: all killed at the ledger gate; Canary 5 used 8 cases and the arms 4 readers · condition list over 96 paid calls costing 0.2450 dollars to ask: Does removing the search fix it? Outcome: No: cheap readers still did not read. Every canary used gpt-5-mini as the answer model, an isolated author, a rubric locked before any output, and, from canary 2 on, a separate isolated blind grader.</desc>

  <rect width="1130" height="760" fill="#fcfcfb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#2c2826">
    <text x="40" y="58" font-size="29" font-weight="650">Five canaries</text>
    <text x="1090" y="58" text-anchor="end" fill="#6b6763" font-size="22">Small, isolated, blind-graded, kill conditions fixed first</text>
    <line x1="40" y1="112" x2="1090" y2="112" stroke="#2c2826" stroke-width="1.5" />
    <text x="55" y="148" fill="#6b6763" font-size="16" font-weight="600">Canary</text>
    <text x="140" y="148" fill="#6b6763" font-size="16" font-weight="600">Cases</text>
    <text x="215" y="148" fill="#6b6763" font-size="16" font-weight="600">Arms</text>
    <text x="505" y="148" fill="#6b6763" font-size="16" font-weight="600">Question</text>
    <text x="890" y="148" text-anchor="end" fill="#6b6763" font-size="16" font-weight="600">Calls</text>
    <text x="985" y="148" text-anchor="end" fill="#6b6763" font-size="16" font-weight="600">Cost</text>
    <line x1="40" y1="170" x2="1090" y2="170" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="207" font-size="20" font-weight="650">1</text>
    <text x="140" y="207" font-size="19">4</text>
    <text x="215" y="207" font-size="17">full · clause · compiler</text>
    <text x="505" y="207" font-size="17">Does the model apply a preserved condition?</text>
    <text x="890" y="207" text-anchor="end" font-size="18">29</text>
    <text x="985" y="207" text-anchor="end" font-size="18">$0.0616</text>
    <text x="505" y="233" fill="#8f684e" font-size="16">No: re-asked on the confirmed send</text>
    <line x1="40" y1="252" x2="1090" y2="252" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="289" font-size="20" font-weight="650">2</text>
    <text x="140" y="289" font-size="19">8</text>
    <text x="215" y="289" font-size="17">+ evidence bare · apply</text>
    <text x="505" y="289" font-size="17">Does quoted evidence beside the rule help?</text>
    <text x="890" y="289" text-anchor="end" font-size="18">80</text>
    <text x="985" y="289" text-anchor="end" font-size="18">$0.1639</text>
    <text x="505" y="315" fill="#8f684e" font-size="16">Worse: evidence became a checklist</text>
    <line x1="40" y1="334" x2="1090" y2="334" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="371" font-size="20" font-weight="650">3</text>
    <text x="140" y="371" font-size="19">8</text>
    <text x="215" y="371" font-size="17">+ model reader</text>
    <text x="505" y="371" font-size="17">Does a model reading the clauses read?</text>
    <text x="890" y="371" text-anchor="end" font-size="18">92</text>
    <text x="985" y="371" text-anchor="end" font-size="18">$0.4110</text>
    <text x="505" y="397" fill="#8f684e" font-size="16">Yes: 3 of 4 fresh confirmations, 0 unsafe</text>
    <line x1="40" y1="416" x2="1090" y2="416" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="453" font-size="20" font-weight="650">4</text>
    <text x="140" y="453" font-size="19">8</text>
    <text x="215" y="453" font-size="17">3 cheaper readers, no answers</text>
    <text x="505" y="453" font-size="17">Can a cheaper reader keep the reading?</text>
    <text x="890" y="453" text-anchor="end" font-size="18">24</text>
    <text x="985" y="453" text-anchor="end" font-size="18">$0.0260</text>
    <text x="505" y="479" fill="#8f684e" font-size="16">No: all killed at the ledger gate</text>
    <line x1="40" y1="498" x2="1090" y2="498" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="55" y="535" font-size="20" font-weight="650">5</text>
    <text x="140" y="535" font-size="19">8</text>
    <text x="215" y="535" font-size="17">4 readers · condition list</text>
    <text x="505" y="535" font-size="17">Does removing the search fix it?</text>
    <text x="890" y="535" text-anchor="end" font-size="18">96</text>
    <text x="985" y="535" text-anchor="end" font-size="18">$0.2450</text>
    <text x="505" y="561" fill="#8f684e" font-size="16">No: cheap readers still did not read</text>
    <line x1="40" y1="580" x2="1090" y2="580" stroke="#d4d1cb" stroke-width="1.5" />
    <rect x="40" y="618" width="1050" height="118" fill="#f4f3ef" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="62" y="646" font-size="17" font-weight="600">Answer model</text>
    <text x="300" y="646" fill="#6b6763" font-size="17">gpt-5-mini-2025-08-07 in every arm; readers were gpt-5-mini or gpt-5-nano at a stated reasoning effort</text>
    <text x="62" y="676" font-size="17" font-weight="600">Evidence class</text>
    <text x="300" y="676" fill="#6b6763" font-size="17">Development canaries: direction, not rate. Every case set is spent after one use.</text>
    <text x="62" y="706" font-size="17" font-weight="600">Total</text>
    <text x="300" y="706" fill="#6b6763" font-size="17">321 paid calls · $0.907, plus the five held-out studies’ $4.9013</text>
  </g>
</svg>

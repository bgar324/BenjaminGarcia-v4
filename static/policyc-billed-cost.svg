    <text x="235" y="104" font-size="20" font-weight="600">Compiled slice</text>
    <text x="1080" y="142" text-anchor="end" fill="#8f684e" font-size="18" font-weight="600">↑ More is worse</text>
    <text x="1080" y="625" text-anchor="end" fill="#8f684e" font-size="18" font-weight="600">↓ Less is better</text>
    <line x1="155" y1="213.333" x2="1090" y2="213.333" stroke="#d4d1cb" stroke-width="1.5" />

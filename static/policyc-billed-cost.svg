<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="762" viewBox="0 0 1130 762" role="img" aria-labelledby="title description">
  <title id="title">PolicyC measured billed cost per execution</title>
  <desc id="description">Actual measured billed cost per execution for the full policy and compiled slice was 0.002592 dollars and 0.001995 dollars for compiler 0.5, a 23.01 percent reduction; 0.003934 dollars and 0.002970 dollars for compiler 0.6, a 24.50 percent reduction; 0.002760 dollars and 0.002425 dollars for compiler 0.7, a 12.14 percent reduction; 0.002885 dollars and 0.002365 dollars for compiler 0.8, a 18.03 percent reduction; 0.003427 dollars and 0.002837 dollars for compiler 0.9, a 17.21 percent reduction. Versions 0.5 through 0.7 use all planned executions; versions 0.8 and 0.9 use complete pairs, matching each frozen audit&#x27;s reported efficiency basis. Both series are measured spend, not forecasts. Less cost is better; more is worse.</desc>


    <text x="40" y="58" font-size="29" font-weight="650">Measured billed cost per execution</text>
    <text x="1090" y="58" text-anchor="end" fill="#6b6763" font-size="22">Full policy vs compiled slice</text>
    <text x="1090" y="105" text-anchor="end" fill="#6b6763" font-size="18">Actual spend; tool fees included</text>

<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="762" viewBox="35 83 1130 762" role="img" aria-labelledby="title description">
  <title id="title">PolicyC input-token reduction across compiler versions</title>
  <desc id="description">Mean actual input-token reduction relative to the full policy was 98.23 percent for compiler 0.5, 89.69 percent for compiler 0.6, and 93.75 percent for compiler 0.7. Each compiler used a newly authored held-out set, so the connected points show a descriptive study sequence rather than controlled version-to-version gains.</desc>
  <rect x="35" y="83" width="1130" height="762" fill="#fcfcfb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#1c1c1a">
    <rect x="36" y="84" width="1128" height="760" fill="none" stroke="#1c1c1a" stroke-width="1.5" />
    <text x="72" y="142" font-size="30" font-weight="650">Mean actual input tokens</text>
    <text x="1128" y="142" text-anchor="end" fill="#67645f" font-size="25">Reduction vs full policy</text>
    <text x="1128" y="188" text-anchor="end" fill="#67645f" font-size="19">Different held-out set per version; sequence is descriptive</text>

    <g stroke="#cfcdc7" stroke-width="1.5">
      <line x1="190" y1="250" x2="1090" y2="250" />
      <line x1="190" y1="397" x2="1090" y2="397" />
      <line x1="190" y1="543" x2="1090" y2="543" />
      <line x1="190" y1="690" x2="1090" y2="690" />
    </g>
    <g fill="#67645f" font-size="23" text-anchor="end">
      <text x="168" y="258">100</text>
      <text x="168" y="405">95</text>
      <text x="168" y="551">90</text>
      <text x="168" y="698">85</text>
      <text x="168" y="741">0</text>
    </g>
    <path d="M181 711 l9 -8 l-9 -8 l9 -8" fill="none" stroke="#1c1c1a" stroke-width="2" />
    <line x1="190" y1="250" x2="190" y2="690" stroke="#1c1c1a" stroke-width="2" />
    <line x1="190" y1="690" x2="1090" y2="690" stroke="#1c1c1a" stroke-width="2" />

    <path d="M330 302 L640 552 L950 433" fill="none" stroke="#1c1c1a" stroke-width="3" />
    <g fill="#cad2b9" stroke="#1c1c1a" stroke-width="2">
      <circle cx="330" cy="302" r="13" />
      <circle cx="640" cy="552" r="13" />
      <circle cx="950" cy="433" r="13" />
    </g>
    <g font-size="23" text-anchor="middle">
      <text x="330" y="270">98.23%</text>
      <text x="640" y="595">89.69%</text>
      <text x="950" y="401">93.75%</text>
    </g>
    <g font-size="24" font-weight="600" text-anchor="middle">
      <text x="330" y="742">0.5</text>
      <text x="640" y="742">0.6</text>
      <text x="950" y="742">0.7</text>
    </g>
    <g fill="#67645f" font-size="19" text-anchor="middle">
      <text x="330" y="770">50 cases</text>
      <text x="640" y="770">50 cases</text>
      <text x="950" y="770">60 cases</text>
    </g>
    <text x="640" y="814" text-anchor="middle" font-size="25">Compiler version</text>
    <text x="90" y="495" text-anchor="middle" font-size="25" transform="rotate(-90 90 495)">Input reduction (%)</text>
  </g>
</svg>

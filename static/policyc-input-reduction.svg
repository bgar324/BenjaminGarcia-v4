<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="762" viewBox="0 0 1130 762" role="img" aria-labelledby="title description">
  <title id="title">PolicyC input-token reduction across compiler versions</title>
  <desc id="description">Mean actual input-token reduction relative to the full policy was 98.23 percent for compiler 0.5, 89.69 percent for compiler 0.6, 93.75 percent for compiler 0.7, 94.76 percent for compiler 0.8, 92.99 percent for compiler 0.9. Each version used a different held-out set, so the connected points show study sequence rather than controlled version-to-version gains. More reduction is better; less is worse.</desc>

  <rect width="1130" height="762" fill="#fcfcfb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#2c2826">
    <rect x="1" y="1" width="1128" height="760" fill="none" stroke="#2c2826" stroke-width="1.5" />
    <text x="40" y="58" font-size="29" font-weight="650">Input reduction</text>
    <text x="1090" y="58" text-anchor="end" fill="#6b6763" font-size="22">Relative to full policy</text>
    <text x="1090" y="105" text-anchor="end" fill="#6b6763" font-size="18">Different held-out set per version; sequence is descriptive</text>
    <text x="1080" y="142" text-anchor="end" fill="#8f684e" font-size="18" font-weight="600">↑ More is better</text>
    <text x="1080" y="590" text-anchor="end" fill="#8f684e" font-size="18" font-weight="600">↓ Less is worse</text>
    <line x1="155" y1="165" x2="1090" y2="165" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="134" y="173" text-anchor="end" fill="#6b6763" font-size="22">100</text>
    <line x1="155" y1="310" x2="1090" y2="310" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="134" y="318" text-anchor="end" fill="#6b6763" font-size="22">95</text>
    <line x1="155" y1="455" x2="1090" y2="455" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="134" y="463" text-anchor="end" fill="#6b6763" font-size="22">90</text>
    <line x1="155" y1="600" x2="1090" y2="600" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="134" y="608" text-anchor="end" fill="#6b6763" font-size="22">85</text>
    <line x1="155" y1="165" x2="155" y2="600" stroke="#2c2826" stroke-width="2" />
    <line x1="155" y1="600" x2="1090" y2="600" stroke="#2c2826" stroke-width="2" />
    <text x="625" y="731" text-anchor="middle" font-size="24">Compiler version</text>
    <text x="52" y="390" text-anchor="middle" font-size="24" transform="rotate(-90 52 390)">Input reduction (%)</text>
    <path d="M146 620 l9 -8 l-9 -8 l9 -8" fill="none" stroke="#2c2826" stroke-width="2" />
    <polyline points="245,216.3 450,464.0 655,346.2 860,317.0 1065,368.3" fill="none" stroke="#2c2826" stroke-width="3" />
    <circle cx="245" cy="216.3" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="245" y="188.33" text-anchor="middle" font-size="21">98.23%</text>
    <circle cx="450" cy="464.0" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="450" y="502.99" text-anchor="middle" font-size="21">89.69%</text>
    <circle cx="655" cy="346.2" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="655" y="318.25" text-anchor="middle" font-size="21">93.75%</text>
    <circle cx="860" cy="317.0" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="860" y="288.96" text-anchor="middle" font-size="21">94.76%</text>
    <circle cx="1065" cy="368.3" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="1065" y="407.29" text-anchor="middle" font-size="21">92.99%</text>
    <text x="245" y="646" text-anchor="middle" font-size="23" font-weight="650">0.5</text>
    <text x="245" y="679" text-anchor="middle" fill="#6b6763" font-size="17">50 cases</text>
    <text x="450" y="646" text-anchor="middle" font-size="23" font-weight="650">0.6</text>
    <text x="450" y="679" text-anchor="middle" fill="#6b6763" font-size="17">50 cases</text>
    <text x="655" y="646" text-anchor="middle" font-size="23" font-weight="650">0.7</text>
    <text x="655" y="679" text-anchor="middle" fill="#6b6763" font-size="17">60 cases</text>
    <text x="860" y="646" text-anchor="middle" font-size="23" font-weight="650">0.8</text>
    <text x="860" y="679" text-anchor="middle" fill="#6b6763" font-size="17">60 cases</text>
    <text x="1065" y="646" text-anchor="middle" font-size="23" font-weight="650">0.9</text>
    <text x="1065" y="679" text-anchor="middle" fill="#6b6763" font-size="17">60 cases</text>
  </g>
</svg>

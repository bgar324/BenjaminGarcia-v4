<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="762" viewBox="0 0 1130 762" role="img" aria-labelledby="title description">
  <title id="title">PolicyC execution-cost reduction across compiler versions</title>
  <desc id="description">Actual billed-cost reduction by compiler was 23.01 percent for 0.5, 24.50 percent for 0.6, 12.14 percent for 0.7, 18.03 percent for 0.8, 17.21 percent for 0.9. Uncached-equivalent cost reduction was 67.80 percent for 0.5, 55.36 percent for 0.6, 59.46 percent for 0.7, 66.00 percent for 0.8, 58.69 percent for 0.9. Compiler 0.9&#x27;s 60 compile-time extractor calls cost 0.2678 dollars and are reported separately, not netted into these execution-study reductions. Every version used a different held-out set. More reduction is better; less is worse.</desc>

  <rect width="1130" height="762" fill="#fcfcfb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#2c2826">
    <rect x="1" y="1" width="1128" height="760" fill="none" stroke="#2c2826" stroke-width="1.5" />
    <text x="40" y="58" font-size="29" font-weight="650">Execution-cost reduction</text>
    <text x="1090" y="58" text-anchor="end" fill="#6b6763" font-size="22">Relative to full policy</text>
    <text x="40" y="105" fill="#6b6763" font-size="18">Paired runs only; 0.9 extraction reported separately</text>
    <rect x="610" y="89" width="17" height="17" fill="#cad2b9" stroke="#2c2826" stroke-width="1.5" />
    <text x="640" y="104" font-size="20" font-weight="600">Uncached-equivalent</text>
    <rect x="880" y="89" width="17" height="17" fill="#c6d6e5" stroke="#2c2826" stroke-width="1.5" />
    <text x="910" y="104" font-size="20" font-weight="600">Actual billed</text>
    <text x="1080" y="142" text-anchor="end" fill="#8f684e" font-size="18" font-weight="600">↑ More is better</text>
    <text x="1080" y="590" text-anchor="end" fill="#8f684e" font-size="18" font-weight="600">↓ Less is worse</text>
    <line x1="155" y1="165" x2="1090" y2="165" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="134" y="173" text-anchor="end" fill="#6b6763" font-size="22">80</text>
    <line x1="155" y1="273.75" x2="1090" y2="273.75" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="134" y="281.75" text-anchor="end" fill="#6b6763" font-size="22">60</text>
    <line x1="155" y1="382.5" x2="1090" y2="382.5" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="134" y="390.5" text-anchor="end" fill="#6b6763" font-size="22">40</text>
    <line x1="155" y1="491.25" x2="1090" y2="491.25" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="134" y="499.25" text-anchor="end" fill="#6b6763" font-size="22">20</text>
    <line x1="155" y1="600" x2="1090" y2="600" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="134" y="608" text-anchor="end" fill="#6b6763" font-size="22">0</text>
    <line x1="155" y1="165" x2="155" y2="600" stroke="#2c2826" stroke-width="2" />
    <line x1="155" y1="600" x2="1090" y2="600" stroke="#2c2826" stroke-width="2" />
    <text x="625" y="731" text-anchor="middle" font-size="24">Compiler version</text>
    <text x="52" y="390" text-anchor="middle" font-size="24" transform="rotate(-90 52 390)">Cost reduction (%)</text>
    <polyline points="245,231.3 450,299.0 655,276.7 860,241.1 1065,280.9" fill="none" stroke="#2c2826" stroke-width="3" />
    <polyline points="245,474.9 450,466.8 655,534.0 860,502.0 1065,506.4" fill="none" stroke="#2c2826" stroke-width="3" />
    <circle cx="245" cy="231.3" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="245" y="204.338" text-anchor="middle" font-size="19">67.80%</text>
    <circle cx="450" cy="299.0" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="450" y="271.98" text-anchor="middle" font-size="19">55.36%</text>
    <circle cx="655" cy="276.7" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="655" y="249.686" text-anchor="middle" font-size="19">59.46%</text>
    <circle cx="860" cy="241.1" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="860" y="214.125" text-anchor="middle" font-size="19">66.00%</text>
    <circle cx="1065" cy="280.9" r="12" fill="#cad2b9" stroke="#2c2826" stroke-width="2" />
    <text x="1065" y="253.873" text-anchor="middle" font-size="19">58.69%</text>
    <circle cx="245" cy="474.9" r="12" fill="#c6d6e5" stroke="#2c2826" stroke-width="2" />
    <text x="245" y="510.883" text-anchor="middle" font-size="19">23.01%</text>
    <circle cx="450" cy="466.8" r="12" fill="#c6d6e5" stroke="#2c2826" stroke-width="2" />
    <text x="450" y="502.781" text-anchor="middle" font-size="19">24.50%</text>
    <circle cx="655" cy="534.0" r="12" fill="#c6d6e5" stroke="#2c2826" stroke-width="2" />
    <text x="655" y="569.989" text-anchor="middle" font-size="19">12.14%</text>
    <circle cx="860" cy="502.0" r="12" fill="#c6d6e5" stroke="#2c2826" stroke-width="2" />
    <text x="860" y="537.962" text-anchor="middle" font-size="19">18.03%</text>
    <circle cx="1065" cy="506.4" r="12" fill="#c6d6e5" stroke="#2c2826" stroke-width="2" />
    <text x="1065" y="542.421" text-anchor="middle" font-size="19">17.21%</text>
    <text x="245" y="646" text-anchor="middle" font-size="23" font-weight="650">0.5</text>
    <text x="450" y="646" text-anchor="middle" font-size="23" font-weight="650">0.6</text>
    <text x="655" y="646" text-anchor="middle" font-size="23" font-weight="650">0.7</text>
    <text x="860" y="646" text-anchor="middle" font-size="23" font-weight="650">0.8</text>
    <text x="1065" y="646" text-anchor="middle" font-size="23" font-weight="650">0.9</text>
  </g>
</svg>

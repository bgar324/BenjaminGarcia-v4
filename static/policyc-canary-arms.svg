<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="970" viewBox="0 0 1130 970" role="img" aria-labelledby="title description">
  <title id="title">PolicyC canary 3 and canary 5 arm outcomes</title>
  <desc id="description">Canary 3, sixteen trials per arm: the compiler 0.10 slice passed 2 with 0 unsafe actions and 8 redundant re-asks and kept 1 of 6 full-policy passes; the clause slice passed 5 with 2 unsafe and 3 re-asks and kept 2 of 6; the full policy passed 6 with 3 unsafe and 2 re-asks and reproduced 2 of 6 of its own other sample&#x27;s passes; the model reader passed 6 with 0 unsafe and 2 re-asks and kept 4 of 6. Canary 5 answer run without a reader: the compiler slice passed 4 with 0 unsafe and 8 re-asks and kept 4 of 5; the clause slice passed 4 with 0 unsafe and 7 re-asks and kept 4 of 5; the full policy passed 5 with 2 unsafe and 0 re-asks and reproduced 4 of 5 of its own; the condition list passed 3 with 0 unsafe and 4 re-asks and kept 3 of 5. Eight cases and two samples per canary; these are directions, not rates.</desc>

  <rect width="1130" height="970" fill="#fcfcfb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#2c2826">
    <text x="40" y="58" font-size="29" font-weight="650">Which prompt did what the policy says</text>
    <text x="1090" y="58" text-anchor="end" fill="#6b6763" font-size="22">Blind-graded canaries, 16 trials per arm</text>
    <text x="40" y="98" fill="#6b6763" font-size="18">Eight fresh cases each, two samples, isolated author and grader, rubric locked before any output. Direction, not rate.</text>
    <rect x="40" y="128" width="17" height="17" fill="#cad2b9" stroke="#2c2826" />
    <text x="68" y="143" font-size="18" font-weight="600">All rubric items pass</text>
    <rect x="330" y="128" width="17" height="17" fill="#d7a18d" stroke="#2c2826" />
    <text x="358" y="143" font-size="18" font-weight="600">Unsafe action</text>
    <rect x="540" y="128" width="17" height="17" fill="#aaa6a0" stroke="#2c2826" />
    <text x="568" y="143" font-size="18" font-weight="600">Redundant re-ask</text>
    <text x="40" y="200" font-size="24" font-weight="650">Canary 3: a model reads the clauses and writes directives</text>
    <text x="1090" y="200" text-anchor="end" fill="#6b6763" font-size="18">Kept = full-policy passes reproduced, of 6</text>
    <line x1="150" y1="474" x2="1090" y2="474" stroke="#d4d1cb" stroke-width="1.5" />

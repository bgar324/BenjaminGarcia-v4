<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="700" viewBox="0 0 1130 700" role="img" aria-labelledby="title description">
  <title id="title">PolicyC strategy-blind paired outcomes across frozen studies</title>
  <desc id="description">Raw determinate paired counts. Compiler 0.5 had 129 pairs: 92 both pass, 15 full policy only, 9 compiler only, and 13 both fail. Compiler 0.6 had 136 determinate pairs: 64 both pass, 10 full policy only, 9 compiler only, and 53 both fail, plus 3 ungradable complete pairs. Compiler 0.7 had 180 pairs: 130 both pass, 33 full policy only, 11 compiler only, and 6 both fail. Each compiler used a different newly authored held-out set, so bar lengths are not controlled version-to-version comparisons.</desc>
  <defs>
    <pattern id="ungradable" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fcfcfb" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8b8782" stroke-width="2" />
    </pattern>
  </defs>
  <rect width="1130" height="700" fill="#fcfcfb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#2c2826">
    <text x="40" y="58" font-size="29" font-weight="650">Strategy-blind paired outcomes</text>
    <text x="1090" y="58" text-anchor="end" fill="#6b6763" font-size="22">Raw determinate counts</text>
    <text x="40" y="98" fill="#6b6763" font-size="18">Different held-out set per version; bar lengths are descriptive, not controlled comparisons.</text>

    <g font-size="18" font-weight="600">
      <rect x="40" y="128" width="17" height="17" fill="#cad2b9" stroke="#2c2826" />
      <text x="68" y="143">Both pass</text>
      <rect x="210" y="128" width="17" height="17" fill="#d7a18d" stroke="#2c2826" />
      <text x="238" y="143">Full policy only</text>
      <rect x="435" y="128" width="17" height="17" fill="#c6d6e5" stroke="#2c2826" />
      <text x="463" y="143">Compiler only</text>
      <rect x="635" y="128" width="17" height="17" fill="#aaa6a0" stroke="#2c2826" />
      <text x="663" y="143">Both fail</text>
      <rect x="790" y="128" width="17" height="17" fill="url(#ungradable)" stroke="#2c2826" />
      <text x="818" y="143">Ungradable</text>
    </g>

    <g stroke="#d4d1cb" stroke-width="1.5">
      <line x1="190" y1="600" x2="990" y2="600" />
      <line x1="190" y1="190" x2="190" y2="600" />
      <line x1="390" y1="190" x2="390" y2="600" />
      <line x1="590" y1="190" x2="590" y2="600" />
      <line x1="790" y1="190" x2="790" y2="600" />
      <line x1="990" y1="190" x2="990" y2="600" />
    </g>

    <g font-size="23" font-weight="650" text-anchor="end">
      <text x="158" y="244">0.5</text>
      <text x="158" y="394">0.6</text>
      <text x="158" y="544">0.7</text>
    </g>

    <g stroke="#2c2826" stroke-width="1.5">
      <rect x="190" y="210" width="409" height="54" fill="#cad2b9" />
      <rect x="599" y="210" width="67" height="54" fill="#d7a18d" />
      <rect x="666" y="210" width="40" height="54" fill="#c6d6e5" />
      <rect x="706" y="210" width="58" height="54" fill="#aaa6a0" />

      <rect x="190" y="360" width="284" height="54" fill="#cad2b9" />
      <rect x="474" y="360" width="45" height="54" fill="#d7a18d" />
      <rect x="519" y="360" width="40" height="54" fill="#c6d6e5" />
      <rect x="559" y="360" width="235" height="54" fill="#aaa6a0" />
      <rect x="794" y="360" width="14" height="54" fill="url(#ungradable)" />

      <rect x="190" y="510" width="578" height="54" fill="#cad2b9" />
      <rect x="768" y="510" width="147" height="54" fill="#d7a18d" />
      <rect x="915" y="510" width="49" height="54" fill="#c6d6e5" />
      <rect x="964" y="510" width="26" height="54" fill="#aaa6a0" />
    </g>

    <g font-size="19">
      <text x="190" y="300">n=129: 92 both pass · 15 full only · 9 compiler only · 13 both fail</text>
      <text x="190" y="450">n=136 determinate: 64 both pass · 10 full only · 9 compiler only · 53 both fail</text>
      <text x="190" y="480" fill="#6b6763">+ 3 ungradable complete pairs</text>
      <text x="190" y="594">n=180: 130 both pass · 33 full only · 11 compiler only · 6 both fail</text>
    </g>

    <g fill="#6b6763" font-size="18" text-anchor="middle">
      <text x="190" y="636">0</text>
      <text x="390" y="636">45</text>
      <text x="590" y="636">90</text>
      <text x="790" y="636">135</text>
      <text x="990" y="636">180 pairs</text>
    </g>
  </g>
</svg>

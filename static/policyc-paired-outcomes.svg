    <rect x="794.4" y="320" width="13.3" height="46" fill="url(#ungradable)" stroke="#2c2826" stroke-width="1.5" />
    <text x="190" y="398" font-size="17">n=136 determinate: 64 both pass · 10 full only · 9 compiler only · 53 both fail</text>
    <text x="190" y="422" fill="#6b6763" font-size="17">+ 3 ungradable complete pairs</text>
    <text x="158" y="475" text-anchor="end" font-size="22" font-weight="650">0.7</text>
    <rect x="190.0" y="445" width="577.8" height="46" fill="#cad2b9" stroke="#2c2826" stroke-width="1.5" />
    <rect x="767.8" y="445" width="146.7" height="46" fill="#d7a18d" stroke="#2c2826" stroke-width="1.5" />
    <rect x="914.4" y="445" width="48.9" height="46" fill="#c6d6e5" stroke="#2c2826" stroke-width="1.5" />
    <rect x="963.3" y="445" width="26.7" height="46" fill="#aaa6a0" stroke="#2c2826" stroke-width="1.5" />
    <text x="190" y="523" font-size="17">n=180: 130 both pass · 33 full only · 11 compiler only · 6 both fail</text>
    <text x="158" y="600" text-anchor="end" font-size="22" font-weight="650">0.8</text>
    <rect x="190.0" y="570" width="444.4" height="46" fill="#cad2b9" stroke="#2c2826" stroke-width="1.5" />
    <rect x="634.4" y="570" width="142.2" height="46" fill="#d7a18d" stroke="#2c2826" stroke-width="1.5" />
    <rect x="776.7" y="570" width="48.9" height="46" fill="#c6d6e5" stroke="#2c2826" stroke-width="1.5" />
    <rect x="825.6" y="570" width="88.9" height="46" fill="#aaa6a0" stroke="#2c2826" stroke-width="1.5" />
    <text x="190" y="648" font-size="17">n=163: 100 both pass · 32 full only · 11 compiler only · 20 both fail</text>
    <text x="158" y="725" text-anchor="end" font-size="22" font-weight="650">0.9</text>
    <rect x="190.0" y="695" width="462.2" height="46" fill="#cad2b9" stroke="#2c2826" stroke-width="1.5" />
    <rect x="652.2" y="695" width="146.7" height="46" fill="#d7a18d" stroke="#2c2826" stroke-width="1.5" />
    <rect x="798.9" y="695" width="93.3" height="46" fill="#c6d6e5" stroke="#2c2826" stroke-width="1.5" />
    <rect x="892.2" y="695" width="84.4" height="46" fill="#aaa6a0" stroke="#2c2826" stroke-width="1.5" />
    <text x="190" y="773" font-size="17">n=177: 104 both pass · 33 full only · 21 compiler only · 19 both fail</text>
  </g>
</svg>

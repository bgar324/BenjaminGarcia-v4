<svg xmlns="http://www.w3.org/2000/svg" width="1130" height="900" viewBox="0 0 1130 900" role="img" aria-labelledby="title description">
  <title id="title">PolicyC strategy-blind paired outcomes across frozen studies</title>
  <desc id="description">Primary strategy-blind semantic paired outcomes. Compiler 0.5 had 129 determinate pairs: 92 both pass, 15 full policy only, 9 compiler only, and 13 both fail. Compiler 0.6 had 136 determinate pairs: 64 both pass, 10 full policy only, 9 compiler only, and 53 both fail, plus 3 ungradable complete pairs. Compiler 0.7 had 180 determinate pairs: 130 both pass, 33 full policy only, 11 compiler only, and 6 both fail. Compiler 0.8 had 163 determinate pairs: 100 both pass, 32 full policy only, 11 compiler only, and 20 both fail. Compiler 0.9 had 177 determinate pairs: 104 both pass, 33 full policy only, 21 compiler only, and 19 both fail. Each compiler used a different held-out set.</desc>
  <defs>
    <pattern id="ungradable" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#fcfcfb" />
      <line x1="0" y1="0" x2="0" y2="8" stroke="#8b8782" stroke-width="2" />
    </pattern>
  </defs>
  <rect width="1130" height="900" fill="#fcfcfb" />
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" fill="#2c2826">
    <text x="40" y="58" font-size="29" font-weight="650">Strategy-blind paired outcomes</text>
    <text x="1090" y="58" text-anchor="end" fill="#6b6763" font-size="22">Primary semantic counts</text>
    <text x="40" y="98" fill="#6b6763" font-size="18">Different held-out set per version; bar lengths are descriptive, not controlled comparisons.</text>
    <rect x="40" y="128" width="17" height="17" fill="#cad2b9" stroke="#2c2826" />
    <text x="68" y="143" font-size="18" font-weight="600">Both pass</text>
    <rect x="210" y="128" width="17" height="17" fill="#d7a18d" stroke="#2c2826" />
    <text x="238" y="143" font-size="18" font-weight="600">Full policy only</text>
    <rect x="435" y="128" width="17" height="17" fill="#c6d6e5" stroke="#2c2826" />
    <text x="463" y="143" font-size="18" font-weight="600">Compiler only</text>
    <rect x="635" y="128" width="17" height="17" fill="#aaa6a0" stroke="#2c2826" />
    <text x="663" y="143" font-size="18" font-weight="600">Both fail</text>
    <rect x="790" y="128" width="17" height="17" fill="url(#ungradable)" stroke="#2c2826" />
    <text x="818" y="143" font-size="18" font-weight="600">Ungradable</text>
    <line x1="190" y1="185" x2="190" y2="830" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="190" y="868" text-anchor="middle" fill="#6b6763" font-size="18">0</text>
    <line x1="390" y1="185" x2="390" y2="830" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="390" y="868" text-anchor="middle" fill="#6b6763" font-size="18">45</text>
    <line x1="590" y1="185" x2="590" y2="830" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="590" y="868" text-anchor="middle" fill="#6b6763" font-size="18">90</text>
    <line x1="790" y1="185" x2="790" y2="830" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="790" y="868" text-anchor="middle" fill="#6b6763" font-size="18">135</text>
    <line x1="990" y1="185" x2="990" y2="830" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="990" y="868" text-anchor="middle" fill="#6b6763" font-size="18">180 pairs</text>
    <line x1="190" y1="830" x2="990" y2="830" stroke="#d4d1cb" stroke-width="1.5" />
    <text x="158" y="225" text-anchor="end" font-size="22" font-weight="650">0.5</text>
    <rect x="190.0" y="195" width="408.9" height="46" fill="#cad2b9" stroke="#2c2826" stroke-width="1.5" />
    <rect x="598.9" y="195" width="66.7" height="46" fill="#d7a18d" stroke="#2c2826" stroke-width="1.5" />
    <rect x="665.6" y="195" width="40.0" height="46" fill="#c6d6e5" stroke="#2c2826" stroke-width="1.5" />
    <rect x="705.6" y="195" width="57.8" height="46" fill="#aaa6a0" stroke="#2c2826" stroke-width="1.5" />
    <text x="190" y="273" font-size="17">n=129: 92 both pass · 15 full only · 9 compiler only · 13 both fail</text>
    <text x="158" y="350" text-anchor="end" font-size="22" font-weight="650">0.6</text>
    <rect x="190.0" y="320" width="284.4" height="46" fill="#cad2b9" stroke="#2c2826" stroke-width="1.5" />
    <rect x="474.4" y="320" width="44.4" height="46" fill="#d7a18d" stroke="#2c2826" stroke-width="1.5" />
